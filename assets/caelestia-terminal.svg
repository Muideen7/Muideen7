    <text x="415" y="208" fill="#a8c7fa" font-size="13">fish 3.7.0 (with starship prompt)</text>

    <!-- 05 · Stack -->
    <g transform="translate(300, 220)" class="icon" stroke="#a8c7fa">
      <path d="M8 1.6l6 2.9-6 2.9-6-2.9z" />
      <path d="M2 7.4l6 2.9 6-2.9" />
      <path d="M2 10.6l6 2.9 6-2.9" />
    </g>
    <text x="322" y="232" fill="#a8c7fa" font-size="13" font-weight="700">Stack</text>
    <text x="415" y="232" fill="#e6e1e5" font-size="13">Next.js · TypeScript · AI Systems</text>

    <!-- 06 · Theme -->
    <g transform="translate(300, 244)" stroke="#a8c7fa">
      <circle cx="8" cy="8" r="6" class="icon" />
      <circle cx="6.3" cy="6.3" r="1.05" fill="#a8c7fa" stroke="none" />
      <circle cx="9.7" cy="5.9" r="1.05" fill="#a8c7fa" stroke="none" />
      <circle cx="10.4" cy="8.7" r="1.05" fill="#a8c7fa" stroke="none" />
    </g>
    <text x="322" y="256" fill="#a8c7fa" font-size="13" font-weight="700">Theme</text>
    <text x="415" y="256" fill="#ffb59d" font-size="13">Material You (M3) Dynamic Tonal</text>

    <!-- 07 · Uptime -->
    <g transform="translate(300, 268)" class="icon" stroke="#ffb59d">
      <circle cx="8" cy="8" r="6" />
      <path d="M8 4.6V8l2.4 1.8" />
    </g>
    <text x="322" y="280" fill="#ffb59d" font-size="13" font-weight="700">Uptime</text>
    <text x="415" y="280" fill="#e6e1e5" font-size="13">Shipping since 2020 (Lagos, NG)</text>

    <!-- 08 · Mindset -->
    <g transform="translate(300, 292)" class="icon" stroke="#ffb59d">
      <path d="M8 1.6l1.7 4.7 4.7 1.7-4.7 1.7L8 14.4l-1.7-4.7L1.6 8l4.7-1.7z" />
    </g>
    <text x="322" y="304" fill="#ffb59d" font-size="13" font-weight="700">Mindset</text>
    <text x="415" y="304" fill="#e6e1e5" font-size="13">Considered, never templated.</text>

    <!-- Material palette strip -->
    <g transform="translate(300, 322)">
      <rect x="0" y="0" width="36" height="15" rx="4" fill="#141218" stroke="#49454f" stroke-width="0.8" />
      <rect x="42" y="0" width="36" height="15" rx="4" fill="#ffb4ab" />
      <rect x="84" y="0" width="36" height="15" rx="4" fill="#7dd0b6" />
      <rect x="126" y="0" width="36" height="15" rx="4" fill="#eed49f" />
      <rect x="168" y="0" width="36" height="15" rx="4" fill="#a8c7fa" />
      <rect x="210" y="0" width="36" height="15" rx="4" fill="#d0bcff" />
      <rect x="252" y="0" width="36" height="15" rx="4" fill="#ffb59d" />
      <rect x="294" y="0" width="36" height="15" rx="4" fill="#e6e1e5" />
    </g>

    <!-- Terminal block -->
    <rect x="295" y="356" width="570" height="96" rx="12" fill="#141218" stroke="#332d41" stroke-width="1" />

    <text x="313" y="386" fill="#d0bcff" font-size="13">╭─ muideen7@caelestia in ~/projects on</text>
    <g transform="translate(614, 373)" stroke="#7dd0b6" fill="none" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="3.5" cy="2.6" r="1.6" />
      <circle cx="3.5" cy="11.4" r="1.6" />
      <circle cx="10.5" cy="3.6" r="1.6" />
      <path d="M3.5 4.2v5.6M3.5 8.2C3.5 5.4 10.5 8 10.5 5.2" />
    </g>
    <text x="630" y="386" fill="#7dd0b6" font-size="13">main</text>

    <text x="313" y="412" fill="#7dd0b6" font-size="13" font-weight="700">╰─</text>
    <g transform="translate(334, 402)" stroke="#7dd0b6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0l4.5 5L0 10" />
    </g>
    <text x="347" y="412" fill="#e6e1e5" font-size="13">deploy --focus="AI &amp; clean UX"<tspan fill="#d0bcff" class="cursor">█</tspan></text>

    <text x="313" y="436" fill="#7dd0b6" font-size="12">✓ compiled in 1.2s · 42 routes · 0 errors</text>
  </g>
</svg>
