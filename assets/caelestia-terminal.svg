    <path d="M 140 140 Q 140 240 240 240 Q 140 240 140 340 Q 140 240 40 240 Q 140 240 140 140 Z" fill="url(#m3Primary)" opacity="0.95" />
    <circle cx="140" cy="240" r="17" fill="#141218" stroke="url(#m3Tertiary)" stroke-width="3" />
    <circle cx="140" cy="240" r="6" fill="#d0bcff" />
  </g>

