<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">muideen7@caelestia — system identity</title>
  <desc id="svgDesc">An animated terminal window in the Material You palette showing the system identity of muideen7: Arch Linux, Hyprland, fish shell, Next.js and TypeScript.</desc>

  <defs>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
        font-variant-ligatures: none;
      }
      .icon {
        fill: none;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(208, 188, 255, 0.35)); transform: scale(1); }
        50%      { filter: drop-shadow(0 0 20px rgba(125, 208, 182, 0.65)); transform: scale(1.035); }
      }
      @keyframes blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .star-logo {
        transform-box: view-box;
        transform-origin: 140px 240px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .cursor {
        animation: blink 1.05s steps(1, end) infinite;
      }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141218" />
      <stop offset="100%" stop-color="#1d1b22" />
    </linearGradient>

    <linearGradient id="m3Primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0bcff" />
      <stop offset="100%" stop-color="#a8c7fa" />
    </linearGradient>

    <linearGradient id="m3Tertiary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd0b6" />
      <stop offset="100%" stop-color="#d0bcff" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49454f" />
      <stop offset="50%" stop-color="#d0bcff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#332d41" />
    </linearGradient>

    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d0bcff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#d0bcff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ Window shell ══ -->
  <rect x="2" y="2" width="896" height="476" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- ══ Title bar ══ -->
  <path d="M 22 2 H 878 A 20 20 0 0 1 898 22 V 46 H 2 V 22 A 20 20 0 0 1 22 2 Z" fill="#1d1b22" />
  <path d="M 2 22 A 20 20 0 0 1 22 2 H 878 A 20 20 0 0 1 898 22" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />
  <line x1="2" y1="46" x2="898" y2="46" stroke="#332d41" stroke-width="1.2" />

  <!-- Window controls -->
  <circle cx="28" cy="24" r="6" fill="#ffb4ab" />
  <circle cx="48" cy="24" r="6" fill="#eed49f" />
  <circle cx="68" cy="24" r="6" fill="#7dd0b6" />

  <!-- Title pill -->
  <rect x="330" y="11" width="240" height="24" rx="12" fill="#2b2831" stroke="#49454f" stroke-width="1" />
  <g transform="translate(382, 15)">
    <path d="M6 0 L7.3 4.4 L11.7 5.7 L7.3 7 L6 11.4 L4.7 7 L0.3 5.7 L4.7 4.4 Z" fill="#d0bcff" />
  </g>
  <text x="400" y="27" fill="#e6e1e5" font-size="11" font-weight="600" class="mono">muideen7@caelestia</text>

  <!-- ══ Left panel — Caelestia star ══ -->
  <g class="star-logo">
