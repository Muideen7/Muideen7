  <text x="140" y="406" text-anchor="middle" fill="#49454f" font-size="11" class="mono">shell · muideen7</text>
  <text x="140" y="430" text-anchor="middle" fill="#7dd0b6" font-size="11" class="mono">● online</text>

  <!-- ══ Divider ══ -->
  <line x1="272" y1="64" x2="272" y2="452" stroke="#332d41" stroke-width="1" stroke-dasharray="4,4" />

