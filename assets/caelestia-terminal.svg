    <text x="386" y="94" fill="#7dd0b6" font-size="17" font-weight="700">@</text>
    <text x="402" y="94" fill="#a8c7fa" font-size="17" font-weight="700">caelestia</text>
    <line x1="300" y1="106" x2="865" y2="106" stroke="#49454f" stroke-width="1" stroke-opacity="0.7" />

    <!-- 01 · OS -->
    <g transform="translate(300, 124)" class="icon" stroke="#d0bcff">
      <rect x="2" y="2.5" width="12" height="8.5" rx="1.6" />
      <path d="M5.5 14h5M8 11v3" />
    </g>
    <text x="322" y="136" fill="#d0bcff" font-size="13" font-weight="700">OS</text>
    <text x="415" y="136" fill="#e6e1e5" font-size="13">Arch Linux x86_64 [Caelestia DE]</text>

    <!-- 02 · Host -->
    <g transform="translate(300, 148)" class="icon" stroke="#d0bcff">
      <circle cx="8" cy="5.2" r="2.4" />
      <path d="M2.8 13.8c0-2.9 2.3-4.9 5.2-4.9s5.2 2 5.2 4.9" />
    </g>
    <text x="322" y="160" fill="#d0bcff" font-size="13" font-weight="700">Host</text>
    <text x="415" y="160" fill="#e6e1e5" font-size="13">Full-Stack Engineer (EEE B.Eng)</text>

    <!-- 03 · WM -->
    <g transform="translate(300, 172)" class="icon" stroke="#7dd0b6">
      <rect x="2" y="2.5" width="12" height="11" rx="1.6" />
      <path d="M9 2.5v11M2 8h7" />
    </g>
    <text x="322" y="184" fill="#7dd0b6" font-size="13" font-weight="700">WM</text>
    <text x="415" y="184" fill="#e6e1e5" font-size="13">Hyprland + Quickshell</text>

    <!-- 04 · Shell -->
    <g transform="translate(300, 196)" class="icon" stroke="#7dd0b6">
