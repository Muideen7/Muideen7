  <circle cx="1040" cy="70" r="26" fill="#f5e0dc" />
  <circle cx="1032" cy="62" r="4" fill="#e6cfc9" opacity="0.6" />
  <circle cx="1050" cy="78" r="3" fill="#e6cfc9" opacity="0.5" />

