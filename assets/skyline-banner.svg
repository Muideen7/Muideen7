    <rect x="140" y="60" width="2" height="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite" /></rect>
    <rect x="220" y="20" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite" /></rect>
    <rect x="340" y="45" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" /></rect>
    <rect x="470" y="25" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite" /></rect>
    <rect x="600" y="15" width="2" height="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite" /></rect>
    <rect x="730" y="50" width="3" height="3"><animate attributeName="opacity" values="1;0.25;1" dur="3.7s" repeatCount="indefinite" /></rect>
